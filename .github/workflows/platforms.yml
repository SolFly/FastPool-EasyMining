name: Native platforms

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            python-arch: arm64
            cc: gcc
          - target: darwin-amd64
            runner: macos-15-intel
            python-arch: x64
            cc: clang
          - target: darwin-arm64
            runner: macos-15
            python-arch: arm64
            cc: clang
          - target: windows-amd64
            runner: windows-2025
            python-arch: x64
            cc: gcc
            msystem: UCRT64
            compiler-directory: ucrt64/bin
            packages: mingw-w64-ucrt-x86_64-gcc
          - target: windows-arm64
            runner: windows-11-arm
            python-arch: arm64
            cc: clang
            msystem: CLANGARM64
            compiler-directory: clangarm64/bin
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-lld mingw-w64-clang-aarch64-gcc-compat
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}
      - name: Install native Windows C compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}
          update: true
      - name: Add compiler to native Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          COMPILER_DIRECTORY: ${{ matrix.compiler-directory }}
        run: |
          $compiler = Join-Path $env:MSYS2_LOCATION $env:COMPILER_DIRECTORY
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native unit tests, build, SQLite restart and package
        env:
          CC: ${{ matrix.cc }}
          TARGET: ${{ matrix.target }}
          PYTHONUTF8: '1'
        run: python scripts/platform-releases.py build --target "${{ matrix.target }}"
      - name: Save native platform files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easymining-platform-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
